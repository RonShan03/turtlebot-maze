name: Visual SLAM validation
on:
  push:
    branches: ['codex/visual-slam']
    paths: ['assignments/assignment-3/**', '.github/workflows/visual-slam.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-and-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: assignments/assignment-3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,download]'
      - run: python -m pytest -q
      - run: python -m task1_python_vslam.cli synthetic --frames 30 --output data/ci-synthetic
      - run: python -m task1_python_vslam.cli run --root data/ci-synthetic --output results/ci-synthetic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-slam-python-results
          path: assignments/assignment-3/results/ci-synthetic
